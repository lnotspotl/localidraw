[project]
name = "localidraw"
version = "0.1.0"
description = "Local Excalidraw with a folder gallery, offline-first Hugging Face bucket sync, and a CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["huggingface_hub>=1.24", "hf-xet>=1.5.2,<2"]

[project.scripts]
localidraw = "localidraw:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/localidraw.py", "/excalidraw/excalidraw-app/build"]
ignore-vcs = true
sources = { "excalidraw/excalidraw-app/build" = "localidraw_web" }
# Sourcemaps are dev-only; the 13 MB CJK font falls back to esm.sh (ExcalidrawFontFace.ts), so only offline CJK text
# loses it. The rest is unreferenced or only for the excalidraw.com site and PWA install dialog.
exclude = [
    "*.map",
    "/excalidraw/excalidraw-app/build/fonts/Xiaolai",
    "/excalidraw/excalidraw-app/build/*.woff2",
    "/excalidraw/excalidraw-app/build/screenshots",
    "/excalidraw/excalidraw-app/build/og-image-3.png",
]

[tool.ruff]
line-length = 120
target-version = "py312"
include = ["*.py"]
extend-exclude = ["excalidraw"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001",  # clash with the formatter
    "D1",                # docstrings are optional
    "CPY",               # no copyright headers
    "EM", "TRY003",      # exception messages stay inline
    "S603",              # advisory only; every subprocess call trips it
    "T201",              # a CLI: printing is the product
    "PLC0415",           # huggingface_hub is imported lazily, so the CLI starts fast
    "S310",              # urlopen only ever targets our own localhost server
    "S607",              # pixi comes from PATH, deliberately
    # The HTTP handlers and argparse main are dispatch tables, and _sync is one
    # linear four-phase pass; splitting them only scatters the flow.
    "C901", "PLR0911", "PLR0912", "PLR0915",
    # Deliberate en dashes, ∕ in bucket file names, › and × in UI and drawing text.
    "RUF001", "RUF002", "RUF003",
    # Timestamps in ids, history file names and the gallery are the user's local wall clock.
    "DTZ005", "DTZ006",
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["PLR0913", "PLR0917", "INP001"]  # standalone scripts; primitives take coordinates positionally

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["localidraw.py", "examples"]
