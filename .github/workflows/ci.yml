name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
      - run: pixi run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
      - run: pixi run wheel
      - name: smoke test the installed wheel
        env:
          LOCALIDRAW_DATA: ${{ runner.temp }}/data
        run: |
          pixi run uv tool install dist/*.whl
          localidraw serve --no-browser &
          curl -sf --retry 20 --retry-connrefused --retry-delay 1 http://localhost:3100/localidraw/gallery > /dev/null
          url=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:3100/new | jq -r .url)
          curl -sf "$url" | grep -q 'id="root"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "$TAG" = "v$version" ] || { echo "$TAG does not match pyproject.toml ($version)"; exit 1; }
          whl=$(basename dist/*.whl)
          gh release create "$TAG" "dist/$whl" --title "$TAG" \
            --notes "curl -LsSf https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh"
